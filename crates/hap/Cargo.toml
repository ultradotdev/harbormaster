[package]
name = "harbormaster-hap"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
httparse = "1.10.1"
num-bigint = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tracing = "0.1.44"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# macOS registers with the system Bonjour daemon instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21.7"
