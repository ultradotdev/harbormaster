[package]
name = "harbormaster"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
anyhow = "1.0.104"
libc = "0.2.191"
harbormaster-hap = { version = "0.1.0", path = "../hap" }
harbormaster-protect = { version = "0.1.0", path = "../protect" }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
zeroize = "1.9.1"
tracing-subscriber = { version = "0.3.23", features = ["registry"] }

[dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
